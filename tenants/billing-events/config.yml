tenant: billing-events
owner: "@org/billing-team"
contacts:
  teams: "Billing Engineering"
  oncall: "billing-oncall"

protocol: kafka
stamps: [us]

client_ids:
  us: { dev: "<us-dev-client-id>", prod: "<us-prod-client-id>" }

namespaces:
  invoices:
    retention: { time: 7d }           # becomes the default for every topic in this namespace
    permissions:
      produce: [billing-events]
      consume: [billing-events, reporting-service]
    topics:
      invoice-created:
        partitions: 3
        max_message_size: 1MiB
        schema: { type: json, compatibility: backward }
        subscriptions:
          - { name: invoice-indexer, consumers: [reporting-service] }   # → consumer group
        native:
          kafka: { cleanup.policy: compact }

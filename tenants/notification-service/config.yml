tenant: notification-service
owner: "@org/notification-team"
contacts:
  teams: "Notification Engineering"
  oncall: "notification-oncall"

protocol: pulsar
stamps: [us, eu]

client_ids:            # stamp → env → client ID (placeholders)
  us: { dev: "<us-dev-client-id>", prod: "<us-prod-client-id>" }
  eu: { prod: "<eu-prod-client-id>" }

namespaces:
  event-notification-global:
    retention: { time: 2d, size: 2GiB }
    permissions:
      produce: [notification-service]
      consume: [notification-service, analytics-pipeline]
    topics:
      email-events:
        partitions: 6
        ttl: 2d                       # optional capability — supported by pulsar
        schema: { type: avro, compatibility: backward, ref: schemas/email-event.avsc }
        subscriptions:
          - { name: email-sender, consumers: [notification-service] }
        native:
          pulsar: { isGlobal: true }  # no portable equivalent
